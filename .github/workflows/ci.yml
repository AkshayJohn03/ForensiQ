name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Lint
        run: pip install ruff -q && python -m ruff check src tests
      - name: Tests (offline)
        run: |
          pip install coverage -q
          coverage run -m pytest tests -q
          coverage report --fail-under=60
      - name: Dependency audit
        run: |
          pip install pip-audit -q
          pip-audit || true
